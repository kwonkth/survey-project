<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Novel Survey</title>
    <link rel="apple-touch-icon" sizes="180x180" href="Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Favicon/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="Favicon/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Gowun Batang', 'Malgun Gothic', sans-serif;
            overflow-x: hidden;  /* 가로 스크롤만 막고 */
            overflow-y: auto;    /* 세로 스크롤은 허용해서 푸터까지 도달 가능하게 */
            background-color: #f0f2f5;
        }
        
        .mobile-container {
            width: 100%;
            max-width: 1080px;
            height: auto;
            max-height: 1920px;
            min-height: 100vh;
            position: relative;
            background-color: transparent;
            box-shadow: none;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;              /* 상단 헤더 / 컨텐츠 / 푸터를 세로로 배치 */
            flex-direction: column;
            margin: 0 auto;             /* 데스크톱에서 가로 기준 가운데 정렬 */
        }
        
        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/배경.png');
            /* 모바일에서 잘리지 않도록 contain + 어두운 배경 사용 */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
            z-index: 0; /* 모든 콘텐츠 뒤로 보내기 (부모 배경 뒤로는 가지 않도록 0으로 설정) */
        }

        #content {
            position: relative;
            z-index: 1; /* 배경보다 위로 올리기 */
            flex: 1 0 auto;            /* 남는 공간을 차지하도록 해서 푸터를 하단으로 밀기 */
            display: flex;
            flex-direction: column;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* 가로 기준으로도 가운데 정렬 */
            padding: 16px 0;
        }
        
        #text-box {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 24px 24px;
            border-radius: 10px;
            max-width: 820px;
            width: calc(100% - 48px); /* 좌우 24px 여백을 항상 유지 (메인 페이지와 동일한 패턴) */
            margin: 24px auto; /* 위아래 24px, 좌우 자동 가운데 정렬 */
            position: relative; /* 하단 마스크를 위한 기준 */
            overflow: hidden;   /* 버튼 아래로 스크롤되는 답변을 가리기 위해 */
        }
        .completion-screen {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 24px;
            margin: 40px auto;
            border-radius: 10px;
            max-width: 800px;
            width: 80%;
            text-align: center;
        }
        
        #question-text,
        #questionContainer p {
            font-size: 1.7rem; /* 데스크톱 기준 (약 27~28px) */
            margin-bottom: 20px;
            min-height: 80px;
            /* 메인 페이지와 톤을 맞춘 밝은 보라 계열 텍스트 색상 */
            color: #f4f1ff;
            text-align: center; /* 질문 텍스트를 가로 기준 가운데 정렬 */
            font-family: 'Gowun Batang', 'Malgun Gothic', sans-serif; /* 메인과 동일 폰트 */
            font-weight: 400;
        }
        
        #optionsContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
            /* PC/모바일 공통: 선택지가 많을 때는 일부만 보이고,
               나머지는 내부 스크롤로 확인하도록 높이 제한 */
            max-height: 260px; /* 데스크톱 기준 약 4~5개 분량으로 더 타이트하게 조정 */
            overflow-y: auto;
            overflow-x: hidden; /* 가로 스크롤은 숨기고 세로만 허용 */
            -webkit-overflow-scrolling: touch;
        }
        
        .option-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border: 1px solid rgba(106, 90, 205, 0.25); /* 메인 보라색 계열 테두리 */
            padding: 18px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.3rem;
            text-align: left;
            transition: all 0.3s ease;
            letter-spacing: 0.2px;
            line-height: 1.6;
            width: 100%;
            box-sizing: border-box;
        }
        
        .option-btn:hover {
            background: #f6f8ff; /* 메인 카드/버튼과 비슷한 연한 보라 배경 */
            transform: translateX(4px);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #6a5acd, #9b59b6); /* 메인 primary 그라디언트 */
            border: 2px solid #4b3d8f; /* primary-dark */
            color: #fff;
            transform: none;
            box-shadow: 0 4px 10px rgba(106, 90, 205, 0.4);
        }

        .text-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 1.1rem;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
        }

        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.75);
        }

        .text-input:focus {
            border-color: rgba(244, 244, 255, 0.95);
            box-shadow: 0 0 0 2px rgba(106, 90, 205, 0.55);
        }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border-radius: 999px;
            border: none;
            /* 메인 페이지와 동일한 보라 계열 버튼 스타일 */
            background: linear-gradient(135deg, #6a5acd, #9b59b6);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Gowun Batang', 'Malgun Gothic', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(106, 90, 205, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box; /* 패딩을 포함해 입력창과 동일한 좌우 폭 유지 */
        }

        .submit-btn:hover {
            background: #4b3d8f; /* var(--primary-dark)와 유사한 진한 보라 */
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(106, 90, 205, 0.5);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: default;
            transform: none;
            box-shadow: none;
        }
        
        #progress {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        #character-name {
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 5px;
        }

        .survey-footer {
            position: relative;
            z-index: 1;
            margin-top: 16px;
            padding: 0.75rem 1.5rem;
            font-size: 0.8rem;
            color: #d1d5db;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(156, 163, 175, 0.4);
        }

        .survey-header-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.98);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .survey-header-left {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .survey-header-icon {
            width: 24px;
            height: 24px;
        }

        .survey-header-title {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6a5acd, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }

        .survey-header-progress {
            font-size: 0.9rem;
            color: #4b5563;
            white-space: nowrap;
        }

        #nextButtonContainer {
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            /* 모바일에서는 전체 페이지를 세로 스크롤 가능하게 유지 */
            body, html {
                min-height: 100vh;
                overflow-y: auto;
            }

            .mobile-container {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }

            #content,
            #game-container {
                height: auto;
                min-height: auto;
            }

            #game-container {
                justify-content: flex-start;
                padding-top: 80px; /* 상단 헤더 높이만큼 여백 */
                padding-bottom: 32px;
            }

            #text-box {
                margin: 12px auto;           /* 가운데 정렬 */
                width: calc(100% - 32px);    /* 좌우 16px씩 정확한 픽셀 여백 확보 */
                max-width: 600px;
                max-height: none;
            }

            #optionsContainer {
                gap: 12px;
                /* 모바일에서 선택지가 5개를 넘어가면, 
                   대략 5개 정도까지만 한 화면에 보이고 
                   나머지는 세로 스크롤로만 보이도록 높이를 제한 */
                max-height: 320px; /* 버튼 높이 기준 약 5개 분량 */
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            /* 모바일 기준 질문/텍스트 타이포 조정 (약 20px 전후) */
            #question-text,
            #questionContainer p {
                font-size: 1.25rem; /* 약 20px */
                line-height: 1.35;
                word-break: keep-all;
                min-height: auto;
            }
            .text-input {
                font-size: 0.95rem; /* ~15px */
                padding: 12px 14px;
                width: 100%;
                max-width: 100%;
                margin: 0 auto;          /* 좌우 대칭 중앙 정렬 */
            }
            .text-input::placeholder {
                font-size: 0.95rem;
            }
            .option-btn {
                padding: 12px 14px;
                font-size: 1.05rem; /* ~17px */
                line-height: 1.35;
                white-space: normal;
                width: 100%;
                max-width: 100%;
                margin: 0 auto;         /* 중앙 정렬 */
            }
            .submit-btn {
                font-size: 1.05rem; /* ~17px */
                padding: 14px 0;
                border-radius: 12px;
                width: 100%;
                max-width: 100%;
                margin: 0 auto;          /* 좌우 대칭 중앙 정렬 */
            }
        }

        .participant-order-number {
            font-size: 2.8rem;
            margin: 0.5rem 0 0.25rem;
            color: #6a5acd; /* 메인 primary 보라색과 동일하게 맞춤 */
        }

        .participant-order-label {
            margin: 0;
            font-size: 1.1rem;
            color: #f9fafb;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div id="background"></div>
        <header class="survey-header-bar">
            <div class="survey-header-left">
                <img src="Favicon/Main_icon.png" alt="서베이 스튜디오 아이콘" class="survey-header-icon">
                <span class="survey-header-title">서베이 스튜디오</span>
            </div>
            <div id="surveyHeaderProgress" class="survey-header-progress"></div>
        </header>
        <div id="content">
            <div id="game-container">
                <div id="text-box">
                    <div id="character-name"></div>
                    <div id="questionContainer"></div>
                    <div id="optionsContainer"></div>
                    <div id="nextButtonContainer"></div>
                </div>
            </div>
        </div>
        <footer class="survey-footer">
            <small>2024 재능대학교 캡스톤 서베이 스튜디오 · 세얼간이 조</small>
        </footer>
    </div>
    <script src="story-engine.js"></script>
    <script src="survey.js"></script>
    </body>
    </html>
