<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>응답률 분석 - Fantasy Quest</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
</head>
<body class="analytics-page">
  <div class="app-container">
    <header class="app-header">
      <div class="logo" onclick="navigateTo('index.html')">설문 마법사</div>
      <nav>
        <button class="nav-btn" onclick="navigateTo('index.html')">대시보드</button>
        <button class="nav-btn" onclick="navigateTo('dashboard.html')">설문 관리</button>
        <button class="nav-btn active" onclick="navigateTo('analytics.html')">결과 분석</button>
      </nav>
    </header>

    <main class="dashboard" style="max-width: 1280px; margin: 0 auto; padding: 0 16px;">
      <h1>응답률 분석</h1>

      <section class="dashboard-grid kpi-grid">
        <div class="dashboard-card kpi-row">
          <div class="kpi-item">
            <div class="kpi-label">선택한 설문 총 응답 수</div>
            <div id="kpiSurveyTotal" class="kpi-value">0건</div>
          </div>
          <div class="kpi-item">
            <div class="kpi-label"><span class="kpi-label-nowrap">최다 선택 항목</span></div>
            <div id="kpiTopOption" class="kpi-value">-</div>
          </div>
        </div>
      </section>

      <section class="dashboard-grid">
        <div class="dashboard-card">
          <h3>설문 및 문항 선택</h3>
          <div class="analytics-toolbar">
            <div class="analytics-filter-group">
              <label for="surveySelector">설문 선택</label>
              <select id="surveySelector" class="form-control">
                <option value="">설문을 먼저 선택해주세요</option>
              </select>
            </div>
            <div class="analytics-filter-group">
              <label for="questionSelect">문항 선택</label>
              <select id="questionSelect" class="form-control" disabled>
                <option value="">설문을 먼저 선택해주세요</option>
              </select>
            </div>
            <div class="analytics-filter-group">
              <label for="dateRangePreset">응답 기간</label>
              <select id="dateRangePreset" class="chart-date-select" aria-label="응답 기간 선택">
                <option value="7d">최근 7일</option>
                <option value="1m">최근 1개월</option>
                <option value="6m">최근 6개월</option>
                <option value="1y">최근 1년</option>
                <option value="all" selected>전체 기간</option>
              </select>
            </div>
            <div class="analytics-toolbar-spacer"></div>
            <div class="analytics-export-group">
              <div class="export-dropdown">
                <button type="button" id="exportToggleBtn" class="btn-modal btn-modal-primary export-toggle">
                  📥 내보내기
                </button>
                <div id="exportMenu" class="export-menu">
                  <button id="exportJsonBtn" class="btn-modal btn-modal-secondary">JSON 내보내기</button>
                  <button id="exportCsvBtn" class="btn-modal btn-modal-secondary">CSV 내보내기</button>
                  <button id="exportXlsBtn" class="btn-modal btn-modal-primary">Excel(CSV) 내보내기</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="dashboard-card" id="overallDoughnutContainer">
          <div class="chart-card-header">
            <div class="chart-title-block">
              <div class="chart-title-row">
                <h3 class="chart-main-title">선택한 문항 – 선택지 분포</h3>
                <span id="selectedQuestionTotal" class="response-badge"></span>
              </div>
              <p id="selectedQuestionTitle" class="chart-question-title" style="margin:0 0 0.25rem 0;"></p>
            </div>
            <div class="chart-header-controls">
              <div class="chart-type-toggle" aria-label="차트 유형 선택">
                <button type="button" class="chart-type-btn active" data-type="doughnut">도넛</button>
                <button type="button" class="chart-type-btn" data-type="bar">막대</button>
              </div>
            </div>
          </div>
          <div class="chart-and-table">
            <div class="chart-area">
              <div class="chart-canvas-wrap"><canvas id="chart2"></canvas></div>
              <div class="empty-state" id="optionEmpty" style="display:none; margin-top:0.5rem;">선택지 기반 문항을 선택하세요.</div>
              <p class="chart-zero-note">회색 막대는 응답 0건(데이터 없음)을 의미합니다.</p>
            </div>
            <div class="table-area">
              <h4 class="table-title">상세 데이터</h4>
              <div id="optionStatsTable" class="option-stats-table"></div>
            </div>
          </div>
        </div>
      </section>
      <div id="analyticsOutput" style="display:none;"></div>
    </main>
  </div>

  <script src="analytics.js"></script>
  <script>
    function navigateTo(page){ window.location.href = page; }
  </script>
  <style>
    /* Scoped styles for analytics page */
    .analytics-page, .analytics-page .dashboard-card, .analytics-page .nav-btn, .analytics-page select, .analytics-page button, .analytics-page input {
      font-family: 'Gowun Batang', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', Arial, sans-serif;
    }

    .analytics-page {
      max-width: 100%;
      overflow-x: hidden !important;
      letter-spacing: normal;
    }

    /* Layout adjustments to reduce excessive side whitespace and improve readability */
    .analytics-page .dashboard {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Single column layout to avoid cards wrapping too much and pushing content downward */
    .analytics-page .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    /* Long survey / question titles in selects: prevent horizontal overflow */
    #surveySelector,
    #questionSelect {
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* Toolbar styling (survey select + export buttons) */
    .analytics-page .analytics-toolbar {
      display: flex;
      gap: 1rem;
      align-items: flex-end;
      flex-wrap: wrap;
      width: 100%;
      max-width: 100%;
      /* 드롭다운 메뉴가 카드 밖으로 자연스럽게 오버레이되도록 오버플로우를 잘라내지 않음 */
      overflow: visible;
    }
    .analytics-page .analytics-filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1 1 calc(33% - 8px);
      min-width: 0 !important;
      max-width: 100%;
    }
    .analytics-page .analytics-toolbar label {
      margin: 0;
      color: #2c3e50;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .analytics-page .analytics-toolbar .form-control,
    .analytics-page .analytics-toolbar .chart-date-select {
      min-width: 0;
    }
    .analytics-page .analytics-toolbar-spacer {
      flex: 1;
    }
    .analytics-page .analytics-export-group {
      display: flex;
      align-items: center;
    }
    /* Desktop: fix survey/question select width so layout does not resize with title length */
    .analytics-page #surveySelector.form-control,
    .analytics-page #questionSelect.form-control {
      width: 260px;
      max-width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #2c3e50;
    }
    .analytics-page #surveySelector.form-control:focus,
    .analytics-page #questionSelect.form-control:focus {
      outline: none;
      border-color: #4a6baf;
      box-shadow: 0 0 0 3px rgba(74, 107, 175, 0.1);
    }
    .analytics-page .btn-modal {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .analytics-page .btn-modal-secondary {
      background: #f3f4f6;
      color: #2c3e50;
    }
    .analytics-page .btn-modal-secondary:hover {
      background: #e5e7eb;
    }
    .analytics-page .btn-modal-primary {
      background: #4a6baf;
      color: #fff;
    }
    .analytics-page .btn-modal-primary:hover {
      background: #3a5a9a;
    }

    /* KPI row above charts */
    .analytics-page .kpi-grid {
      margin-top: 0.5rem;
      margin-bottom: 1rem;
    }
    .analytics-page .kpi-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .analytics-page .kpi-item {
      flex: 1;
      min-width: 180px;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }
    .analytics-page .kpi-label {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 0.25rem;
    }
    .analytics-page .kpi-label-nowrap {
      white-space: nowrap;
    }
    .analytics-page .kpi-value {
      font-size: 2rem; /* 대시보드 위젯처럼 숫자를 크게 강조 */
      font-weight: 700;
      color: #111827;
    }

    /* Chart header title + badge */
    .analytics-page .chart-title-block {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .analytics-page .chart-title-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .analytics-page .chart-main-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #111827;
      word-break: keep-all;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Question text under title: smaller and lighter */
    .analytics-page .chart-question-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: #4b5563;
    }

    /* Total responses badge next to chart type toggle */
    .analytics-page .response-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.7rem;
      border-radius: 999px;
      background: #eef2ff;
      color: #4a6baf;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* Chart header + chart type toggle */
    .analytics-page .chart-card-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .analytics-page .chart-header-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .analytics-page .chart-date-select {
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
      width: 120px;
      max-width: 100%;
    }
    .analytics-page .chart-type-toggle {
      display: inline-flex;
      border-radius: 999px;
      background: #f3f4f6;
      padding: 2px;
    }
    .analytics-page .chart-type-btn {
      border: none;
      background: transparent;
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      color: #4b5563;
    }
    .analytics-page .chart-type-btn.active {
      background: #4a6baf;
      color: #fff;
    }

    /* Chart + table layout */
    .analytics-page .chart-and-table {
      display: grid;
      grid-template-columns: 2fr 1.3fr;
      gap: 1rem;
      align-items: flex-start;
    }
    /* 차트/테이블 카드 최소 높이 유지 */
    .analytics-page #overallDoughnutContainer {
      min-height: 360px;
      overflow-x: hidden; /* 카드 자체에서 가로 넘침 차단 */
    }
    .analytics-page .chart-area {
      min-height: 300px;
      display: flex;
      justify-content: flex-start; /* 공통: 차트를 항상 카드의 왼쪽에 정렬 */
    }
    .analytics-page .chart-canvas-wrap {
      height: 300px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
      max-width: 100%;
      overflow: hidden; /* 차트 캔버스가 카드 폭을 넘지 못하게 고정 */
    }
    .analytics-page .chart-canvas-wrap canvas {
      min-width: 0; /* 고정 폭을 제거해 작은 화면에서도 가로 슬라이드가 생기지 않도록 */
    }
    /* 선택지 표 영역 최소 높이 */
    .analytics-page .table-area {
      min-height: 180px;
    }

    /* Ensure chart area and canvas never overflow their parent width */
    .analytics-page .chart-area,
    .analytics-page .chart-canvas-wrap {
      max-width: 100% !important;
      overflow-x: hidden !important;
    }
    .analytics-page .chart-canvas-wrap canvas,
    .analytics-page #chart2 {
      display: block;
      max-width: 100% !important;
      width: 100% !important;
      height: auto !important;
    }
    .analytics-page .table-area {
      border-left: 1px solid #e5e7eb;
      padding-left: 1rem;
    }
    .analytics-page .table-title {
      margin: 0 0 0.5rem 0;
      font-size: 0.95rem;
      color: #374151;
    }
    .analytics-page .option-stats-table {
      font-size: 0.85rem;
    }
    .analytics-page .option-stats-table table {
      width: 100%;
      border-collapse: collapse;
    }
    .analytics-page .option-stats-table th,
    .analytics-page .option-stats-table td {
      padding: 0.35rem 0.25rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .analytics-page .option-stats-table th {
      font-weight: 600;
      color: #4b5563;
    }

    .analytics-page .chart-zero-note {
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    /* 선택지 없음(Empty) 메시지를 가운데 위치시키기 */
    .analytics-page .empty-state {
      min-height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .analytics-page .option-color-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 0.35rem;
      vertical-align: middle;
    }

    .analytics-page .option-label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .analytics-page .option-label-text {
      letter-spacing: normal;
    }

    /* Export dropdown */
    .analytics-page .export-dropdown {
      position: relative;
    }
    .analytics-page .export-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .analytics-page .export-menu {
      position: absolute;
      right: 0;
      top: 110%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
      padding: 0.4rem;
      display: none;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 180px;
      z-index: 10;
    }
    .analytics-page .export-menu.open {
      display: flex;
    }
    .analytics-page .export-menu .btn-modal {
      width: 100%;
      justify-content: flex-start;
    }

    /* Make charts area breathe nicely */
    .analytics-page #dropoffContainer h3,
    .analytics-page #perSurveyContainer h3 {
      margin-bottom: 0.75rem;
    }

    @media (max-width: 900px) {
      .analytics-page .chart-and-table {
        grid-template-columns: 1fr;
      }
      .analytics-page .table-area {
        border-left: none;
        border-top: 1px solid #e5e7eb;
        padding-left: 0;
        padding-top: 0.75rem;
      }
    }

    /* Mobile-specific tightening: ensure no horizontal scrolling on small screens */
    @media (max-width: 768px) {
      .analytics-page .dashboard {
        max-width: 100%;
        padding: 0.75rem;
      }

      .analytics-page h1 {
        font-size: 1.35rem;
        margin-bottom: 0.75rem;
      }

      .analytics-page .dashboard-card {
        padding: 0.9rem 0.9rem;
      }

      .analytics-page .kpi-item {
        padding: 0.7rem 0.75rem;
        min-width: 0;
      }
      .analytics-page .kpi-label {
        font-size: 0.8rem;
      }
      .analytics-page .kpi-value {
        font-size: 1.05rem;
      }

      .analytics-page .analytics-toolbar {
        gap: 0.5rem;
        flex-direction: column;   /* 모바일에서는 설문/문항/응답기간을 위→아래로 세로 배치 */
        align-items: stretch;
        width: 100%;
      }
      .analytics-page .analytics-toolbar label {
        font-size: 0.85rem;
      }
      .analytics-page .analytics-toolbar .form-control,
      .analytics-page select.form-control {
        font-size: 0.9rem;
      }

      .analytics-page .chart-and-table {
        gap: 0.5rem;
      }
      .analytics-page .table-area {
        border-top: 1px solid #e5e7eb;
        padding-top: 0.5rem;
      }

      .analytics-page .chart-area {
        min-height: 220px;
        display: flex;
        justify-content: flex-start; /* 도넛을 카드의 왼쪽으로 정렬 */
      }
      .analytics-page .chart-canvas-wrap {
        height: 220px;
        display: flex;
        justify-content: flex-start !important;
        align-items: center;
        overflow-x: hidden !important; /* 모바일에서는 가로 스크롤 제거 */
        width: 100% !important;
        max-width: 100% !important;
        margin-right: auto; /* flex 컨테이너 내에서 왼쪽에 고정 */
      }
      .analytics-page .chart-canvas-wrap canvas {
        min-width: 0;
        width: 100% !important;
        height: 220px !important;
      }

      /* 모바일에서 도넛 캔버스가 카드 폭을 넘지 않도록 강제 */
      #chart2 {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
      }

      .analytics-page .chart-zero-note {
        font-size: 0.75rem;
      }

      /* 긴 텍스트가 모바일에서 가로로 넘치지 않도록 처리 */
      .analytics-page .chart-main-title,
      .analytics-page .chart-question-title,
      .analytics-page .option-label-text {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .analytics-page .analytics-toolbar {
        width: 100%;
      }
      /* 모바일에서 설문/문항 셀렉트는 100% 폭, 응답 기간은 별도 폭 적용 (Option A) */
      .analytics-page .analytics-filter-group {
        width: 100%;
        max-width: 100%;
      }
      .analytics-page .analytics-filter-group .form-control {
        width: 100%;
        max-width: 100%;
      }
      #dateRangePreset.chart-date-select {
        width: 120px;
        max-width: 100%;
        align-self: flex-start;
      }

      .analytics-page .option-stats-table {
        font-size: 0.8rem;
      }
      .analytics-page .option-stats-table th,
      .analytics-page .option-stats-table td {
        padding: 0.3rem 0.2rem;
      }
      /* 도넛 / 막대 그래프 전환 버튼: 모바일에서도 가로(좌우)로 나란히 유지 */
      .analytics-page .chart-header-controls {
        justify-content: flex-start;
      }
      .analytics-page .chart-type-toggle {
        display: inline-flex;
        flex-wrap: nowrap;
        white-space: nowrap;
      }
      .analytics-page .chart-type-btn {
        font-size: 0.8rem;
        padding: 0.2rem 0.6rem;
      }
    }
  </style>
</body>
</html>
